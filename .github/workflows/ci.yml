name: Android CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APKs (SDK 37 / NDK 30 / Gradle 9.7+)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_NDK_VERSION: 30.0.16248370

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.7+
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses & Install Components (Platform 37, NDK 30, CMake)
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "cmake;3.22.1"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Compile APKs with Gradle Wrapper
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: ./gradlew assemble --stacktrace

      - name: Verify Built Artifacts
        run: |
          echo "Generated build artifacts:"
          ls -la app/build/outputs/apk/debug/
          ls -la app/build/outputs/apk/release/ || true

      - name: Upload Build Artifacts (Validity: 1 Day)
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-mobile-apks
          path: |
            app/build/outputs/apk/**/*.apk
          retention-days: 1
          if-no-files-found: error
